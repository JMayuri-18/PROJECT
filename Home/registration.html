<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <!-- Roll Number -->
        <div class="form-row">
            <label>Roll no. :</label>
            <input type="text" name="rollno">
        </div>

        <!-- Student Name -->
        <div class="form-row">
            <label>Student name :</label>

            <div class="student-name">
                <input type="text" name="firstname" placeholder="First Name">
                <span>-</span>
                <input type="text" name="lastname" placeholder="Last Name">
            </div>
        </div>

        <!-- Father's Name -->
        <div class="form-row">
            <label>Father's name :</label>
            <input type="text" name="fathername">
        </div>

        <!-- Date of Birth -->
        <div class="form-row">
            <label>Date of birth :</label>

            <div class="dob">
                <input type="text" placeholder="Day">
                <span>-</span>
                <input type="text" placeholder="Month">
                <span>-</span>
                <input type="text" placeholder="Year">
                <i>(DD-MM-YYYY)</i>
            </div>
        </div>

        <!-- Mobile Number -->
        <div class="form-row">
            <label>Mobile no. :</label>

            <div class="mobile">
                <input type="text" value="+91" readonly>
                <span>-</span>
                <input type="text" name="mobile">
            </div>
        </div>

        <!-- Email -->
        <div class="form-row">
            <label>Email id :</label>
            <input type="email" name="email">
        </div>

        <!-- Password -->
        <div class="form-row">
            <label>Password :</label>
            <input type="password" name="password">
        </div>

        <!-- Gender -->
        <div class="form-row">
            <label>Gender :</label>

            <div class="gender">
                <input type="radio" name="gender" value="male">
                <span>Male</span>

                <input type="radio" name="gender" value="female">
                <span>Female</span>
            </div>
        </div>

        <!-- Department -->
        <div class="form-row">
            <label>Department :</label>

            <div class="department">
                <label>
                    <input type="checkbox" name="department" value="CSE">
                    CSE
                </label>

                <label>
                    <input type="checkbox" name="department" value="IT">
                    IT
                </label>

                <label>
                    <input type="checkbox" name="department" value="ECE">
                    ECE
                </label>

                <label>
                    <input type="checkbox" name="department" value="Civil">
                    Civil
                </label>

                <label>
                    <input type="checkbox" name="department" value="Mech">
                    Mech
                </label>
            </div>
        </div>

        <!-- Course -->
        <div class="form-row">
            <label>Course :</label>

            <select name="course">
                <option value="">---------------- Select Current Course's ----------------</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>MCA</option>
                <option>MBA</option>
            </select>
        </div>

        <!-- Student Photo -->
        <div class="form-row">
            <label>Student photo :</label>

            <input type="file" name="photo">
        </div>

        <!-- City -->
        <div class="form-row">
            <label>City :</label>
            <input type="text" name="city">
        </div>

        <!-- Address -->
        <div class="form-row address-row">
            <label>Address :</label>
            <textarea name="address"></textarea>
        </div>

        <!-- Register Button -->
        <div class="button-row">
            <button type="submit">Register</button>
        </div>

    </form>

</body>
</html>
